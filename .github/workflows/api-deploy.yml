name: api-deploy
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-deploy.yml']
  workflow_dispatch:

concurrency:
  group: api-deploy          # 배포는 절대 병렬로 돌리지 않는다
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: dip-eat
  PROJECT_NUMBER: '178327258666'
  REGION: asia-northeast3
  SERVICE: dipeat-api
  AR_REPO: dipeat

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    env:
      GEMINI_API_KEY: ci-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0   # ⚠️ 이동 태그가 v7 에서 멈춰 있다 — 전체 버전 고정
        with: { enable-cache: true, cache-dependency-glob: api/uv.lock }
      - run: uv sync --locked
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # PR review revision도 같은 Cloud Run 서비스를 갱신한다. 두 서비스 변경이 겹치면
    # tag/traffic 설정이 서로 덮일 수 있으므로 실제 Cloud Run mutation만 전역 직렬화한다.
    concurrency:
      group: api-cloud-run
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write        # ⚠️ 없으면 WIF 가 조용히 실패한다
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/dip-eat
          service_account: gh-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 빌드 & 푸시 (amd64 고정)
        env:
          IMG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        run: |
          # 기본 docker 드라이버는 registry 캐시를 못 내보낸다 → container 드라이버.
          docker buildx create --use --driver docker-container --name dipeat || true
          # ⚠️ 여기서 :latest 를 붙이지 않는다. 아직 스모크를 안 거친 이미지다.
          #    수동 복구 절차(docs/deploy.md 8장·부록 A)가 :latest 를 쓰기 때문에,
          #    검증 전에 붙이면 "스모크에 떨어진 이미지를 손으로 운영에 올리는" 길이 열린다.
          #    스모크 통과 뒤 마지막 스텝에서 붙인다.
          docker buildx build \
            --platform linux/amd64 \
            --file api/Dockerfile \
            --tag "$IMG:${{ github.sha }}" \
            --cache-from type=registry,ref=$IMG:buildcache \
            --cache-to   type=registry,ref=$IMG:buildcache,mode=max \
            --push api

      - name: 트래픽 없이 배포 (candidate 태그)
        env:
          IMG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        # ⚠️ --set-env-vars 는 환경변수 집합을 통째로 교체한다.
        #    콘솔에서 변수를 추가했다면 여기에도 같이 넣어야 다음 배포가 날리지 않는다.
        #    CORS 는 평소엔 안 쓰인다(Vercel rewrite 프록시라 동일 출처). 프록시가 버퍼링해서
        #    VITE_API_BASE 로 Cloud Run 을 직접 부르는 비상 계획(deploy.md 부록 A)을 위해 넣어둔다 —
        #    그때 가서 재배포부터 해야 하면 계획이 아니다. 도메인은 하이픈이 있는 dip-eat 이다.
        #    콤마는 gcloud 가 항목 구분자로 먹으므로 커스텀 구분자 ^@^ 를 유지할 것(docs/deploy.md 5.5).
        # ⚠️ --min-instances 0 이 박혀 있다. 발표 당일 1 로 올려둔 상태에서 이 워크플로가 돌면
        #    콜드스타트가 되돌아온다. 발표일에는 배포하지 말 것(docs/deploy.md 9장).
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMG:${{ github.sha }}" \
            --region "$REGION" \
            --no-traffic --tag candidate \
            --allow-unauthenticated \
            --service-account "dipeat-api-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --cpu 1 --memory 2Gi --cpu-boost \
            --concurrency 8 --max-instances 4 --min-instances 0 \
            --timeout 105 \
            --startup-probe httpGet.path=/api/v1/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=3,failureThreshold=10 \
            --set-secrets GEMINI_API_KEY=gemini-key:latest \
            --set-env-vars '^@^DIPEAT_GEMINI_MAX_ATTEMPTS=1@DIPEAT_MAX_UPLOAD_BYTES=2097152@DIPEAT_LOG_LEVEL=INFO@DIPEAT_CORS_ORIGINS=["https://dip-eat.vercel.app"]'

      - name: 스모크 — 실배포본에서 시크릿·모델·라우팅·업로드 확인
        run: |
          # ⚠️ pipefail 이 없으면 curl 실패가 tee/jq 뒤에 묻힌다.
          set -o pipefail
          # Cloud Run URL 은 결정적이다. describe 로 파싱할 필요가 없다.
          TAG_URL="https://candidate---${SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"

          # 1) 부팅 + 시크릿 주입
          curl -fsS --max-time 30 "$TAG_URL/api/v1/health" | tee /dev/stderr | jq -e '.has_api_key == true'

          # 2) 1차 모델이 이 키로 실제 응답하는지. 텍스트 전용 ~1초, 1원 미만.
          #    .model 까지 찍어두면 폴백으로 에스컬레이션했는지도 로그에 남는다.
          curl -fsS --max-time 60 -X POST "$TAG_URL/api/v1/chat" \
            -H 'content-type: application/json' \
            -d '{"text":"물 한 잔 주세요","source_lang":"ja","direction":"ko2local"}' \
          | tee /dev/stderr | jq -e '.translated | length > 0'

          # 3) 이 서비스의 주 경로. 위 둘은 전부 텍스트 전용이라 멀티파트 파싱,
          #    patch_multipart_part_limit(Starlette 몽키패치), BodySizeLimitMiddleware,
          #    Pillow 디코드, NDJSON 프레이밍 중 아무것도 건드리지 않는다.
          #    그중 하나가 깨지면 CI 초록 + 스모크 통과 상태로 모든 사진 업로드가 죽는다.
          #    14KB 합성 메뉴판, 몇 원.
          #    (curl 을 head 로 바로 물리면 SIGPIPE 로 죽어서 pipefail 에 걸린다 — 파일로 받는다.)
          curl -fsS --max-time 90 -X POST "$TAG_URL/api/v1/menu/scan/stream" \
            -F 'image=@api/tests/fixtures/smoke_menu.jpg;type=image/jpeg' \
            -F 'mode=poster' -o scan.ndjson

          jq -rs 'map(.type) | "스트림 \(length)줄: \(group_by(.) | map("\(.[0])×\(length)") | join(", "))"' \
            scan.ndjson >&2

          # ⚠️ 첫 줄만 보면 안 된다. 이 라우트는 **실패해도 HTTP 200** 이라(첫 바이트에 상태가
          #    확정된다) curl -f 가 성공으로 끝나고, 오류는 본문의 error 줄이나 done 누락으로만
          #    드러난다. 첫 항목 이후의 생성 실패·NDJSON 미완결이 그대로 운영에 올라갈 수 있다.
          #    프런트(lib/api.ts)가 거절하는 조건과 같은 것을 여기서도 본다:
          #    meta 로 시작 · error 줄 없음 · 항목 1개 이상 · done 으로 끝.
          jq -se '
            (.[0].type == "meta")
            and (any(.[]; .type == "error") | not)
            and (any(.[]; .type == "item"))
            and (.[-1].type == "done")
          ' scan.ndjson > /dev/null

      - name: 스모크 통과 → 트래픽 전환
        id: shift
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest

      - name: 트래픽 전환 완료 → :latest 를 '마지막 정상 빌드' 로 옮긴다
        env:
          IMG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          SHA: ${{ github.sha }}
        # 수동 복구 절차(deploy.md 8장·부록 A)가 :latest 를 가리키므로, 여기까지 온 이미지만 붙인다.
        #
        # ⚠️⚠️ `gcloud artifacts docker tags add` 를 쓰지 말 것. 그건 Artifact Registry **API** 라,
        #    이미 있는 :latest 를 다른 digest 로 옮기려면 옛 digest 에서 먼저 떼어내야 해서
        #    `artifactregistry.tags.delete` 를 요구한다. 배포 계정에는 `artifactregistry.writer`
        #    만 있고(deploy.md 2.5) 거기엔 그 권한이 없다 → PR #19~#22 배포가 **전부** 이 줄에서
        #    PERMISSION_DENIED 로 빨갛게 끝났다. 운영은 매번 정상이었고(트래픽 전환은 앞 스텝에서
        #    이미 끝난다) :latest 만 2026-07-26 이미지에 멈춰 있었다 — 그 상태로 8장 롤백을 밟으면
        #    이틀 치 배포가 조용히 되돌아간다. 빨간 X 보다 이쪽이 훨씬 위험했다.
        #
        #    imagetools 는 Docker 레지스트리 프로토콜로 매니페스트만 다시 쓴다. 쓰기 권한이면
        #    충분하고(#19 이전 `buildx --tag $IMG:latest` 가 정확히 그 경로로 기존 태그를
        #    덮어썼다 — 2026-07-26 배포 2건이 그 증거), 레이어를 다시 올리지 않으므로 빠르다.
        #    새 인덱스가 :sha 와 같은 자식 매니페스트를 가리키므로 내용물은 스모크를 통과한 그 이미지다.
        run: docker buildx imagetools create --tag "$IMG:latest" "$IMG:$SHA"

      # ⚠️ 실패 알림을 둘로 나눈다. 트래픽 전환 '뒤' 단계가 실패했는데 "운영은 무사" 라고 하면
      #    거짓말이다 — 운영은 이미 새 리비전이고, 손봐야 할 건 :latest 쪽이다.
      - name: 실패 — 트래픽 전환 전이므로 운영은 무사
        if: failure() && steps.shift.outcome != 'success'
        run: echo "::warning::candidate 리비전이 스모크에서 떨어졌습니다. 운영 트래픽은 이전 리비전에 그대로 있습니다."

      - name: 실패 — 트래픽은 이미 넘어갔다
        if: failure() && steps.shift.outcome == 'success'
        run: |
          echo "::error::운영 배포 자체는 성공했습니다(트래픽 전환 완료). 그 뒤 단계가 실패했으니 \
          :latest 가 이전 이미지를 가리킬 수 있습니다 — 수동 복구(deploy.md 8장)를 하기 전에 확인하세요."
